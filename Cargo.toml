[workspace]
resolver = "2"
members = [
    "crates/saphren-core",
    "crates/saphren-mcp",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
axum = "0.8"
rmcp = { version = "3.12", features = ["server", "transport-streamable-http-server"] }
saphren-core = { path = "crates/saphren-core" }
saphren-mcp = { path = "crates/saphren-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.28", features = ["derive", "function"] }
specta-typescript = "0.0.15"
tauri = { version = "2", features = ["specta"] }
tauri-build = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
